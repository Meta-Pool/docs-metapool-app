name: docs-metapool-app
static_sites:
  - name: docs
    github:
      repo: Meta-Pool/docs-metapool-app
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: dist
    index_document: index.html
    error_document: 404.html
    envs:
      - key: ASTRO_TELEMETRY_DISABLED
        scope: BUILD_TIME
        value: "1"
